# Balanceador de las instancias de sfe-api. En produccion terminar TLS aqui (certificado + TLS 1.2/1.3) y no exponer 80.
limit_req_zone $http_x_api_key zone=por_caja:10m rate=50r/s;

server {
    listen 80;
    client_max_body_size 1m;                      # una venta no necesita mas
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;       # DNS de Docker: reresuelve api tras reconstruir
    set $sfe_api http://api:8080;
    location /api/ {
        limit_req zone=por_caja burst=100 nodelay;
        proxy_pass $sfe_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}